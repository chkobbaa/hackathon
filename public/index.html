<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis-Grid: Hotel Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            max-width: 1200px;
            width: 100%;
            padding: 40px;
            box-sizing: border-box;
        }

        .game-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #reservoirs-container {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            width: 100%;
            justify-content: center;
        }

        .reservoir {
            width: 60px;
            height: 120px;
            border: 3px solid #475569;
            border-radius: 8px 8px 12px 12px;
            border-top: 2px dashed #94a3b8;
            background: rgba(15, 23, 42, 0.8);
            position: relative;
            overflow: hidden;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .reservoir.visible {
            display: block;
        }

        .water-level {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            transition: height 0.2s ease;
        }

        .water-level::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.4);
        }

        #game-wrapper {
            position: relative;
            background: #0f172a;
            padding: 10px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5), 
                        0 0 0 1px rgba(255, 255, 255, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        canvas {
            display: block;
            border-radius: 16px;
            background-color: #e2e8f0; 
        }

        #status-pill {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444; 
            box-shadow: 0 0 10px #ef4444;
        }

        .status-connected .status-dot {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }
        .status-connected {
            color: #10b981 !important;
        }

        .info-panel {
            width: 320px;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }

        .info-panel h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-panel p.subtitle {
            color: #94a3b8;
            margin: 0 0 24px 0;
            font-size: 14px;
            line-height: 1.6;
        }

    </style>
</head>
<body>

    <div class="layout">
        <div class="game-section">
            
            <div id="reservoirs-container">
                <div class="reservoir visible" id="reservoir-0"><div class="water-level" id="water-level-0" style="height: 0%;"></div></div>
                <div class="reservoir" id="reservoir-1"><div class="water-level" id="water-level-1" style="height: 0%;"></div></div>
                <div class="reservoir" id="reservoir-2"><div class="water-level" id="water-level-2" style="height: 0%;"></div></div>
                <div class="reservoir" id="reservoir-3"><div class="water-level" id="water-level-3" style="height: 0%;"></div></div>
                <div class="reservoir" id="reservoir-4"><div class="water-level" id="water-level-4" style="height: 0%;"></div></div>
                <div class="reservoir" id="reservoir-5"><div class="water-level" id="water-level-5" style="height: 0%;"></div></div>
            </div>

            <div id="game-wrapper">
                <div id="status-pill">
                    <div class="status-dot"></div>
                    <span id="status-text">Connecting...</span>
                </div>
                <canvas id="gameCanvas" width="700" height="500"></canvas>
            </div>
        </div>

        <div class="info-panel">
            <h1>Hotel Simulator</h1>
            <p class="subtitle">Live Hotel Monitor. 9 rooms connected to the localized Oasis-Grid bio-filter grid.</p>
            
            <button id="auto-btn" style="background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; font-family: 'Inter', sans-serif; cursor: pointer; transition: 0.3s; width: 100%; font-size: 16px;">Start Automatic AI</button>
            <div style="height: 24px;"></div>
            
            <img src="bio_filter_diagram.png" alt="Bio Filter Exploded View" style="width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js?v=2"></script>
</body>
</html>
